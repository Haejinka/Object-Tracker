<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Object Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand-mark" aria-hidden="true">OT</div>
    <div class="brand-copy">
      <h1>Object Tracker</h1>
      <p id="connectionStatus" class="subtle">Connecting to Premiere Pro…</p>
    </div>
  </header>

  <main>
    <section class="utility-panel" aria-label="Object tracking controls">
      <section class="content-section" aria-labelledby="sourceHeading">
        <div class="section-heading">
          <h2 id="sourceHeading">Source</h2>
          <button id="readTrackButton" class="button button-quiet" type="button" disabled>Detect</button>
        </div>
        <div id="trackSource" class="source-summary" aria-live="polite">
          <span class="state-dot" aria-hidden="true"></span>
          <span class="source-copy"><span id="trackSourceText">Select the clip with the tracked Object Mask.</span><span id="trackTrackMeta" class="source-meta"></span></span>
        </div>
      </section>

      <div class="divider"></div>

      <section class="content-section" aria-labelledby="targetHeading">
        <div class="section-heading">
          <h2 id="targetHeading">Target</h2>
          <button id="useSelectionButton" class="button button-quiet" type="button" disabled>Use Selection</button>
        </div>
        <div id="targetSummary" class="target-summary" aria-live="polite">
          <span id="targetName">No target selected</span>
          <span id="targetType" class="target-type"></span>
        </div>
      </section>

      <div class="divider"></div>

      <section class="content-section" aria-labelledby="trackingHeading">
        <div class="section-heading tracking-heading">
          <h2 id="trackingHeading">Tracking</h2>
        </div>
        <div class="settings-row mode-row">
          <span class="field-label">Mode</span>
          <div class="segmented" role="group" aria-label="Tracking mode">
            <label><input type="radio" name="trackMode" value="follow" checked><span>Follow</span></label>
            <label><input type="radio" name="trackMode" value="stabilize"><span>Stabilize</span></label>
          </div>
        </div>
        <div class="transform-row">
          <span class="field-label">Transform</span>
          <div class="transform-options">
            <span class="transform-property">Position</span>
            <label class="axis-option"><input id="xAxis" type="checkbox" checked> X</label>
            <label class="axis-option"><input id="yAxis" type="checkbox" checked> Y</label>
            <label class="transform-option scale-option" title="Follows validated changes in the Object Mask size."><input id="autoScale" type="checkbox" disabled> Scale</label>
            <label class="transform-option" title="Raises the target Transform effect's Shutter Angle to at least 180° and uses its native motion blur."><input id="motionBlur" type="checkbox" disabled> Motion Blur</label>
          </div>
        </div>
      </section>

      <div class="divider"></div>

      <button id="applyTrackButton" class="button button-primary action-button" type="button" disabled>
        <span class="button-spinner" aria-hidden="true"></span>
        <span id="applyButtonText">Apply Tracking</span>
      </button>

      <div id="resultStatus" class="result-status" role="status" aria-live="polite">
        <span class="status-indicator" aria-hidden="true"></span>
        <span id="statusText">Ready</span>
      </div>

    </section>
  </main>

  <script src="js/CSInterface.js"></script>
  <script src="js/state.js"></script>
  <script src="js/bridge.js"></script>
  <script src="js/gdeflate.js"></script>
  <script src="js/object-mask-parser.js"></script>
  <script src="js/tracking-pipeline.js"></script>
  <script src="js/project-reader.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
